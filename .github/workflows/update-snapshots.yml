name: Update visual snapshots

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / ref to update (defaults to main)"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Use the default GITHUB_TOKEN to push the regenerated snapshots
          # back to the same branch. Branch-protection rules apply.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Content check (voice + schema)
        run: npm run check:content

      - name: Build (Next.js static export)
        run: npm run build:cf

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Regenerate snapshots
        run: npx playwright test --update-snapshots
        env:
          CI: "true"

      - name: Commit and push refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain tests/__snapshots__/)" ]]; then
            echo "No snapshot changes — UI matches the on-disk baseline."
            exit 0
          fi

          git add tests/__snapshots__/
          git commit -m "$(cat <<'EOF'
          Refresh visual snapshots (workflow run #${GITHUB_RUN_NUMBER})

          Regenerated by .github/workflows/update-snapshots.yml on the
          Linux CI runner so pixel values match what the CI smoke-test
          job sees. Triggered manually via workflow_dispatch.
          EOF
          )"
          git push origin "HEAD:${{ inputs.ref }}"
