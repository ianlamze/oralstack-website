name: Update visual snapshots

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / ref to update (defaults to main)"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Use the default GITHUB_TOKEN to push the regenerated snapshots
          # back to the same branch. Branch-protection rules apply.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Content check (voice + schema)
        run: npm run check:content

      - name: Build (Next.js static export)
        run: npm run build:cf

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Regenerate snapshots
        run: npx playwright test --update-snapshots
        env:
          CI: "true"

      - name: Commit and push refreshed snapshots
        env:
          TARGET_REF: ${{ inputs.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain tests/__snapshots__/)" ]]; then
            echo "No snapshot changes — UI matches the on-disk baseline."
            exit 0
          fi

          git add tests/__snapshots__/

          # Build the commit message in a tmp file so the heredoc captures
          # expanded env vars but doesn't get clobbered by the outer shell's
          # quoting layers.
          {
            echo "Refresh visual snapshots (workflow run #${RUN_NUMBER})"
            echo
            echo "Regenerated by .github/workflows/update-snapshots.yml on the"
            echo "Linux CI runner so pixel values match what the CI smoke-test"
            echo "job sees. Triggered manually via workflow_dispatch."
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt

          # Race-safe push: between checkout and now, someone may have pushed
          # to the same branch. Rebase onto the latest remote, then push.
          # Loop a couple of times in case of rapid concurrent pushes.
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_REF"
            if git rebase "origin/$TARGET_REF"; then
              if git push origin "HEAD:$TARGET_REF"; then
                echo "Pushed snapshots on attempt $attempt."
                exit 0
              fi
            else
              echo "Rebase failed — aborting and retrying."
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; retrying after backoff."
            sleep $((attempt * 5))
          done
          echo "Failed to push refreshed snapshots after 3 attempts."
          exit 1
